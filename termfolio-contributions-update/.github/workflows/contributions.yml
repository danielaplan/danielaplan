name: Update terminal contributions
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, readme-preview1]
    paths:
      - 'assets/terminal.template.svg'
      - 'scripts/update_contributions.py'
      - '.github/workflows/contributions.yml'
permissions:
  contents: write
concurrency:
  group: terminal-calendar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate from GitHub contribution calendar
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_contributions.py
      - name: Commit only changed SVG
        run: |
          git add assets/terminal.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh terminal contribution calendar'
          git push
